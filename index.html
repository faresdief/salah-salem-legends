<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121212"><meta name="color-scheme" content="dark"><meta name="description" content="صلاح سالم: سباق الأساطير - لعبة سباقات مصرية على طريق صلاح سالم"><title>صلاح سالم: سباق الأساطير</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23121212'/%3E%3Crect x='3' y='7' width='10' height='5' fill='%23D4AF37'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css"></head>
<body>
<canvas id="cv"></canvas>
<div id="hud" hidden>
 <div class="bar">
  <div><small>كم/س</small><b id="spd">0</b></div>
  <div><small>النقاط</small><b><span id="scr">0</span> <span id="cmb" class="g">x1</span></b><div class="fill"><i id="ctb"></i></div></div>
  <div><small>الوقت</small><b id="tm">90</b></div>
  <div><small>تيربو</small><div id="trb" class="cells"></div></div>
  <div><small>الهيكل</small><div class="fill"><i id="chs"></i></div></div>
  <span id="atm" class="badge"></span>
  <button class="ib" id="bMute" title="M"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zM16 9a4 4 0 010 6"/></svg></button>
  <button class="ib" id="bLight" title="L"><svg viewBox="0 0 24 24"><path d="M10 5a7 7 0 000 14zM2 9h5M2 12h5M2 15h5"/></svg></button>
  <button class="ib" id="bRest" title="R"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-3-6.2M20 4v5h-5"/></svg></button>
 </div>
 <div id="pops"></div>
</div>
<div id="flash"></div>
<div id="touch" hidden>
 <div><button data-k="left"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><button data-k="right"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div>
 <div><button data-k="drift">دريفت</button><button data-k="horn">كلاكس</button><button data-k="down"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><button data-k="up"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button></div>
</div>
<section id="menu" class="overlay"><div class="panel">
 <h1>صلاح سالم: سباق الأساطير</h1>
 <nav class="tabs"><button class="tab on" data-t="tRace">السباق</button><button class="tab" data-t="tLobby">الأونلاين واللوبي</button></nav>
 <div id="tRace">
  <canvas id="pv" width="320" height="170"></canvas>
  <div class="sel"><button class="ib" id="pr"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button><b id="cn"></b><button class="ib" id="nx"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button></div>
  <div id="stats"></div>
  <div class="row"><button class="btn alt mode on" data-m="ta">سباق ضد الزمن</button><button class="btn alt mode" data-m="endless">طريق مفتوح</button></div>
  <p class="mu">الأسهم أو WASD قيادة | مسافة أو Shift دريفت | H كلاكس | L نور | N الجو | R إعادة | M صوت</p>
  <button class="btn" id="go">ابدأ السباق</button>
 </div>
 <div id="tLobby" hidden>
  <input id="ln" placeholder="اسم اللاعب" maxlength="14">
  <div class="row"><button class="btn alt" id="lcreate">إنشاء لوبي</button><input id="lc" placeholder="الكود" maxlength="4"><button class="btn alt" id="ljoin">دخول</button></div>
  <ul id="ll"></ul><button class="btn alt" id="lready">جاهز</button><p class="mu" id="ls">غير متصل بلوبي</p>
 </div>
</div></section>
<section id="over" class="overlay" hidden><div class="panel">
 <h1>انتهى السباق</h1>
 <table><tr><td>النقاط</td><td id="oS"></td></tr><tr><td>المسافة (كم)</td><td id="oD"></td></tr><tr><td>غرز قريبة</td><td id="oN"></td></tr><tr><td>أعلى كومبو</td><td id="oC"></td></tr><tr><td>مخالفات الرادار</td><td id="oT"></td></tr><tr><td>أعلى نتيجة</td><td id="oH"></td></tr></table>
 <button class="btn" id="again">العب تاني</button>
</div></section>
<script src="js/config.js"></script>
<script src="js/audio.js"></script>
<script src="js/road-engine.js"></script>
<script src="js/renderer.js"></script>
<script src="js/open-world.js"></script>
<script src="js/network.js"></script>
<script src="js/game.js"></script>
</body></html>
